<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0F1626">
  <title>Light Runner</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" hidden>Connection lost. Lights keep running. Reconnecting…</div>

  <!-- Top bar: what is on stage, then only the state that matters right now. -->
  <header id="topBar" class="topbar">
    <span class="now">
      <span id="nowName" class="now-name">—</span>
      <span id="nowChanged" class="changed" hidden>changed</span>
    </span>
    <span id="quiet" class="quiet">
      <span id="fading" class="q" hidden>fading<span class="fade-bar"><span id="fadeFill"></span></span><b id="fadeLeft"></b></span>
      <span id="flashNote" class="q flash-note" hidden></span>
      <div class="fadepick">
        <button id="fadeButton" class="fade-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="fadeMenu">
          Fade <b id="fadeValue">Auto</b>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="fadeMenu" class="fade-menu" role="menu" hidden>
          <button role="menuitemradio" data-fade="auto">Auto <small>each look's own</small></button>
          <button role="menuitemradio" data-fade="0">Instant</button>
          <button role="menuitemradio" data-fade="1">1 s</button>
          <button role="menuitemradio" data-fade="3">3 s</button>
          <button role="menuitemradio" data-fade="5">5 s</button>
          <button role="menuitemradio" data-fade="10">10 s</button>
        </div>
      </div>
      <span class="q link" id="link"><span class="dot"></span><span id="linkText">Connecting</span></span>
    </span>
    <span id="outputNote" class="output-note" hidden><span class="dot"></span><span id="outputText"></span></span>
    <span class="clock" id="clock"></span>
    <a class="gear" href="/settings/" aria-label="Settings" title="Settings (PIN)">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.3-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </a>
  </header>

  <!-- Left column: stage preview (looking only), then the running order. -->
  <aside class="left">
    <canvas id="stage" class="stage" aria-label="Stage view"></canvas>
    <nav class="order" aria-label="Running order">
      <div id="orderHead" class="order-head">
        <span class="order-title">Running order</span>
        <button id="editBtn" class="ebtn" aria-pressed="false">Edit</button>
      </div>
      <div id="runningOrder" class="order-list"></div>
      <div id="orderFoot" class="order-foot">
        <button id="addSong" class="add-song">＋ Add song</button>
      </div>
    </nav>
  </aside>

  <!-- Right column. -->
  <main class="right">
    <!-- Quick looks: three tabs and a grid; the last tile opens the "new quick look" sheet over the details. -->
    <section id="quickLooks" class="block quick-looks" aria-label="Quick looks">
      <div class="qhead">
      <span class="sec-title">Quick looks</span>
      <div class="qtabs" role="tablist" aria-label="Quick look tabs">
        <button class="tab on" data-qt="plain" role="tab" aria-selected="true">Plain</button>
        <button class="tab" data-qt="colours" role="tab" aria-selected="false">Colours</button>
        <button class="tab" data-qt="effects" role="tab" aria-selected="false">Effects</button>
      </div>
      </div>
      <div id="qGrid" class="qgrid"></div>
    </section>
    <!-- Details: the item on stage with Back / Save, one row per group, and the colour picker over the top. -->
    <section id="details" class="block details" aria-label="Details">
      <div class="dhead">
        <h2 id="dTitle">Details</h2>
        <button id="backBtn" class="ghost" hidden>Back</button>
        <button id="saveBtn" class="save" hidden><span class="fill"></span><span class="label">Save <small>hold</small></span></button>
      </div>
      <div id="groupRows" class="rows"></div>
      <div id="picker" class="picker" hidden>
        <div class="phead">
          <h2 id="pTitle"></h2>
          <span id="pCur" class="cur"><i id="pCurSw"></i><span id="pCurText"></span></span>
          <button id="pDone" class="done">Done</button>
        </div>
        <div class="ptabs" role="tablist">
          <button class="tab on" data-pt="col" role="tab" aria-selected="true">Colours</button>
          <button class="tab" data-pt="fx" role="tab" aria-selected="false">Effects</button>
        </div>
        <div id="pCol" class="pcol">
          <div id="pGrid" class="pgrid"></div>
          <p id="pAnyLab" class="lab2">Any colour</p>
          <div id="pAny" class="strip2 hue" aria-label="Any colour"><span id="pAnyH" class="strip-handle" hidden></span></div>
        </div>
        <p id="pFx" class="soon" hidden>Effects come later.</p>
      </div>
      <div id="qSheet" class="picker qsheet" hidden>
        <div class="phead">
          <h2>New quick look from the stage</h2>
          <button id="qsCancel" class="ghost">Cancel</button>
          <button id="qsSave" class="done">Save</button>
        </div>
        <label class="lab2" for="qsName">Name</label>
        <input id="qsName" class="qs-name" type="text" maxlength="40" placeholder="e.g. Blue and warm" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" spellcheck="false">
        <p class="lab2" id="qsTabLab">Tab</p>
        <div id="qsTab" class="seg" role="radiogroup" aria-labelledby="qsTabLab">
          <button data-t="plain" role="radio">Plain</button>
          <button data-t="colours" role="radio">Colours</button>
          <button data-t="effects" role="radio">Effects</button>
        </div>
        <p class="lab2">Groups it sets <span class="lab-note">· tap a group to leave it out; left-out groups keep what they have</span></p>
        <div id="qsGroups" class="gpick"></div>
      </div>
    </section>
  </main>

  <!-- Bottom bar. -->
  <footer class="bottom">
    <div id="masterFader" class="master" aria-label="Master">
      <div class="master-label"><span>Master</span><b id="masterValue">100%</b></div>
      <div id="masterTrack" class="master-track" role="slider" aria-label="Master" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0">
        <div id="masterFill" class="master-fill"></div>
        <div id="masterHandle" class="master-handle"></div>
      </div>
    </div>
    <!-- Flash: hold a button and the group goes to full white; let go and it drops back. Built from the groups. -->
    <div id="flashArea" class="flash-area" role="group" aria-label="Flash (hold)"></div>
    <button id="undo" class="action undo" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      Undo
    </button>
    <button id="next" class="action next" aria-label="Next">
      <small>Next ▸</small>
      <span id="nextName" class="next-name">—</span>
    </button>
    <button id="blackout" class="action blackout"><span class="hold"></span><span class="label">Blackout<small>hold 1 s</small></span></button>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
