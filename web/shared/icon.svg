<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Light Runner: a run of light segments brightening left to right to a warm-white head (the designer's 1024 px master). -->
  <defs>
    <linearGradient id="lrBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17264A"/><stop offset="1" stop-color="#0A1222"/></linearGradient>
    <radialGradient id="lrGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F4EBD8" stop-opacity="0.5"/><stop offset="1" stop-color="#F4EBD8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#lrBg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="#94A3B8" stroke-opacity=".22" stroke-width="4"/>
  <circle cx="818" cy="512" r="250" fill="url(#lrGlow)"/>
  <rect x="156" y="457" width="100" height="110" rx="28" fill="#4389E8" fill-opacity=".14"/>
  <rect x="278" y="457" width="100" height="110" rx="28" fill="#4389E8" fill-opacity=".24"/>
  <rect x="401" y="457" width="100" height="110" rx="28" fill="#4389E8" fill-opacity=".38"/>
  <rect x="523" y="457" width="100" height="110" rx="28" fill="#4389E8" fill-opacity=".6"/>
  <rect x="646" y="457" width="100" height="110" rx="28" fill="#9CC0F5" fill-opacity=".88"/>
  <rect x="768" y="457" width="100" height="110" rx="28" fill="#F4EBD8"/>
  <rect x="156" y="650" width="712" height="12" rx="6" fill="#4389E8" fill-opacity=".5"/>
</svg>
