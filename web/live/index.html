<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0c0d11">
  <title>Light Runner · Live</title>
  <link rel="icon" href="/shared/icon-16.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/shared/icon-180.png">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The new operator page (25 Nov 2026 design, docs/user-stories.md). Built beside /operator/ until it does everything. -->
  <div id="banner" class="banner" hidden>Connection lost. Lights keep running. Reconnecting…</div>

  <div class="page">
    <!-- Top bar: what is on stage, then Fade, Tempo, Tap, Master, Live / Prepare and the pages. -->
    <header class="bar top">
      <div class="now">
        <span id="nowLabel" class="caps">On stage</span>
        <span id="nowName" class="now-name">—</span>
      </div>
      <span class="grow"></span>
      <button id="fadeBtn" class="btn stack" type="button" title="Fade time for every change"><span class="caps">Fade</span><b id="fadeValue">Auto</b></button>
      <button id="tempoBtn" class="btn stack" type="button" title="Stage tempo"><span class="caps">Tempo</span><b><span id="tempoValue">120</span> bpm</b></button>
      <button id="tapBtn" class="btn" type="button" title="Tap along with the band">Tap</button>
      <button id="masterBtn" class="btn stack" type="button" title="Master: opens the faders" aria-controls="faders"><span class="caps">Master</span><b id="masterValue">100 %</b></button>
      <div class="seg" role="group" aria-label="Live or Prepare">
        <button id="liveBtn" type="button" class="on" aria-pressed="true">Live</button>
        <!-- A short hold peeks; about 1 s locks Prepare on; a tap turns it off. -->
        <button id="prepBtn" type="button" class="prep" aria-pressed="false" title="Hold to peek; hold 1 s to keep Prepare on"><span class="hold"></span><svg class="lock" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Prepare</span></button>
      </div>
      <nav id="pageTabs" class="ds-pagetabs" data-page="operator" aria-label="Pages"></nav>
    </header>

    <!-- Left: the stage as the audience sees it, your changes under it, then who the pads work on. -->
    <section class="left">
      <div class="panel stage-panel">
        <div id="stageWrap" class="stage-wrap"><canvas id="stage" class="stage" aria-label="The stage"></canvas></div>
        <!-- The song list: the service's order on the left, the picked song's parts and Start on the right. -->
        <div id="songs" class="songs" role="dialog" aria-label="Song list" hidden>
          <div class="f-head">
            <span class="title">Songs</span>
            <span id="sSub" class="sub"></span>
            <span class="grow"></span>
            <button id="sClose" class="btn icon" type="button" aria-label="Close the song list">×</button>
          </div>
          <div class="s-body">
            <div id="songList" class="s-list"></div>
            <div class="s-pick">
              <span id="sName" class="s-name">—</span>
              <span id="sFacts" class="sub"></span>
              <span class="caps">Parts · tap to jump</span>
              <div id="sParts" class="s-parts"></div>
              <span class="grow"></span>
              <button id="sStart" class="btn next s-start" type="button" hidden></button>
            </div>
          </div>
        </div>
        <!-- Faders: slide up over the lower part of the stage; a tap elsewhere closes them. -->
        <div id="faders" class="faders" role="dialog" aria-label="Faders" hidden>
          <div class="f-head">
            <button id="fBack" class="btn f-back" type="button" hidden>‹ All groups</button>
            <span id="fTitle" class="title">Faders</span>
            <span id="fSub" class="sub"></span>
            <span class="grow"></span>
            <button id="fRelease" class="btn" type="button" hidden>Let go of all</button>
            <button id="fClose" class="btn icon" type="button" aria-label="Close the faders">×</button>
          </div>
          <div id="faderRow" class="fader-row"></div>
        </div>
        <div class="changes">
          <span class="caps">Your changes</span>
          <span id="noChanges" class="sub">None. The stage is as the cue was saved.</span>
          <div id="changes" class="chips"></div>
          <span class="grow"></span>
          <!-- Prepare only: keep the draft in the step being prepared (hold, so a stray tap never changes the show). -->
          <button id="saveBtn" class="btn save" type="button" hidden><span class="hold"></span><span id="saveText">Save</span><small>hold</small></button>
        </div>
      </div>
      <div class="panel who">
        <div id="who" class="who-list" role="radiogroup" aria-label="Who the pads work on"></div>
        <button id="fadersBtn" class="btn icon" type="button" aria-label="Faders" title="Faders" aria-expanded="false" aria-controls="faders">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16"/><path d="M4 14h4M10 8h4M16 12h4"/></svg>
        </button>
      </div>
    </section>

    <!-- Right: the pads and the song's colour square. -->
    <section class="right">
      <div class="panel pads-panel">
        <div class="head pads-head">
          <span class="title">Pads</span><span id="padsFor" class="sub">for all lights</span>
          <span class="grow"></span>
          <!-- How long a colour or effect started from here lasts: until the next cue, pinned, or a few beats. -->
          <!-- Speed: one round of the running effect every 1 to 16 beats, on the picked groups. Its colours and pattern carry on. -->
          <span class="how-wrap"><span class="caps how-label">Speed</span>
          <div id="padSpeed" class="seg small" role="radiogroup" aria-label="Speed: beats for one round of the running effect"></div>
          <span class="caps how-label">beats</span></span>
        </div>
        <!-- While the picked group runs an effect: Pin, Freeze and Stop (its speed is at the top of the pads). -->
        <div id="fxBar" class="fx-bar" hidden>
          <div class="fx-name"><span id="fxName" class="title"></span><span id="fxNote" class="sub"></span></div>
          <button id="fxPin" class="btn" type="button" aria-pressed="false">Pin</button>
          <button id="fxFreeze" class="btn" type="button" aria-pressed="false">Freeze</button>
          <button id="fxStop" class="btn" type="button">Stop</button>
        </div>
        <div id="pads" class="pads"></div>
      </div>
      <div class="panel colour-panel">
        <div class="head colour-head">
          <span class="title">Colour</span><span id="squareFor" class="sub">tap for all lights</span>
          <span class="grow"></span>
          <!-- Type an exact value: kelvin on the warm-to-cool strip, a colour code (#rrggbb) on the square. Enter sends it. -->
          <button id="sqEdit" class="btn icon sq-editbtn" type="button" aria-pressed="false" title="Change the corner colours" aria-label="Change the corner colours">✎</button>
          <label class="cin"><input id="colourIn" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="Exact colour"><span id="colourUnit"></span></label>
        </div>
        <button id="square" class="square" type="button" aria-label="Colour square: tap a spot to colour the picked lights">
          <span id="cTL" class="corner tl"></span><span id="cTR" class="corner tr"></span>
          <span id="cBL" class="corner bl"></span><span id="cBR" class="corner br"></span>
          <span id="ticks" class="ticks" aria-hidden="true"></span>
          <span id="puck" class="puck" hidden></span>
          <span id="puckK" class="puck-k" hidden></span>
        </button>
        <!-- Changing the corners: tap a corner, pick a colour; for this song or every song; Save. -->
        <div id="sqEditBar" class="sq-edit" hidden>
          <div id="sqScope" class="seg small" role="radiogroup" aria-label="Whose square">
            <button type="button" data-scope="song" id="sqSong">This song</button>
            <button type="button" data-scope="show">Every song</button>
          </div>
          <button id="sqClear" class="btn" type="button" hidden>Use the show's</button>
          <span class="grow"></span>
          <button id="sqCancel" class="btn" type="button">Cancel</button>
          <button id="sqSave" class="btn sq-save" type="button">Save</button>
        </div>
        <div id="sqPalette" class="sq-palette" role="dialog" aria-label="Pick a colour for the corner" hidden>
          <div class="f-head"><span id="sqPalTitle" class="title"></span><span class="grow"></span><button id="sqPalClose" class="btn icon" type="button" aria-label="Close">×</button></div>
          <div id="sqColours" class="sq-colours"></div>
        </div>
      </div>
    </section>

    <!-- Bottom: the song, its steps, Next (and what it changes) and Blackout. Always here. -->
    <footer class="bar bottom">
      <button id="songBtn" class="btn song" type="button" title="Song list" aria-expanded="false" aria-controls="songs">
        <span id="songOf" class="caps">Song</span><b><span id="songName">—</span> ▾</b>
      </button>
      <div id="steps" class="steps"></div>
      <!-- Prepare only: back to live (the draft is dropped), or Go (the draft fades onto the stage). -->
      <button id="backLive" class="btn back" type="button" hidden>Back to live</button>
      <button id="goBtn" class="btn next go" type="button" hidden>
        <span class="caps">Go ▸ <span id="goName">—</span></span>
        <span id="goWhat" class="next-what"></span>
      </button>
      <button id="next" class="btn next" type="button">
        <span class="caps">Next ▸ <span id="nextName">—</span></span>
        <span id="nextWhat" class="next-what"></span>
      </button>
      <button id="blackout" class="btn blackout" type="button"><span class="hold"></span><b>Blackout</b><small>hold 1 s</small></button>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
